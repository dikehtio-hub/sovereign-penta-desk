# Dexter controllable units — agents and bots that process_manager.py can start/stop.
#
# Fields:
#   id           unique slug, used on the CLI (e.g. `python -m core.cli start <id>`)
#   name         human label
#   category     agent | bot | test  (informational only)
#   cwd          absolute working directory the subprocess runs in
#   command      exact literal argv — no auto-detection, no flag standardization,
#                since every project here has its own invocation convention
#   enabled      hard gate; `start` refuses if false, no bypass flag
#   description  what it does
#   notes        optional — why it's disabled, caveats, etc.

- id: arbitrage-agent
  name: Arbitrage Agent (Base L2 DEX)
  category: agent
  cwd: "C:\\Users\\ixis1\\Desktop\\DEV\\AGENTS\\Arbitrage Agent"
  command: ["python", "agent.py", "--mode", "paper", "--interval", "2.0"]
  enabled: true
  description: "Autonomous Base L2 DEX arbitrage agent. Paper mode by default."

- id: funding-arbitrage-agent
